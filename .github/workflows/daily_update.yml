name: NBA Schedule & Odds Monitor

on:
  workflow_dispatch:
    inputs:
      force_predict:
        description: 'Force Run Prediction?'
        required: false
        default: 'true'

  schedule:
    - cron: '*/30 * * * *'
  
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  daily-task:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      CHEAT_MODE: false 

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Fetch Schedule, Odds & Live Scores"
        run: |
          echo "🏀 Fetching Schedule & Odds..."
          python scrape_schedule.py
          
          echo "🏆 Grading Past Picks..."
          python grade_picks.py

      - name: "Run Heavy AI Pipeline (Only at 22:00)"
        run: |
          CURRENT_HOUR=$(date -u +%H)
          echo "Current UTC Hour: $CURRENT_HOUR"
          
          if [ "$CURRENT_HOUR" == "14" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "🚀 It's 22:00 CST! Starting Heavy Training & Data Update..."
            # 🔥 每天只在這裡下載一次最新數據
            python fetch_kaggle_data.py
            python build_player_features.py
            python train_model.py
            python utils/export_impact_data.py
          else
            echo "💤 Not 22:00 CST. Skipping heavy training and downloading."
          fi

      - name: "Generate Live Predictions"
        run: |
          echo "🔮 Generating Live Picks..."
          python aggregate_picks.py

      - name: "Commit and Push Results"
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 🧹 清道夫：刪除超過 100MB 的怪物檔案，避免撐爆 GitHub 限制
          rm -f data/PlayerStatistics.csv
          
          # 🔥 確保輕巧且必備的 TeamStatistics.csv 被強制加入
          git add -f data/TeamStatistics.csv || true
          
          # 加入其他所有變更 (包含 .pkl 模型與預測結果)
          git add .
          
          if git diff --staged --quiet; then
            echo "✅ No changes to commit."
          else
            git commit -m "🤖 Auto-update: Schedule, Odds, Picks & CSV Data"
            git push
          fi