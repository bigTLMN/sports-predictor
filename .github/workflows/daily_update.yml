name: NBA Schedule & Odds Monitor

on:
  # 1. 手動觸發
  workflow_dispatch:
    inputs:
      force_predict:
        description: 'Force Run Prediction?'
        required: false
        default: 'true'

  # 2. 定時排程 (每 15 分鐘檢查一次)
  schedule:
    - cron: '*/15 23,0-14 * * *'
  
  # 3. 代碼推送時自動觸發 (可選)
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  daily-task:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      # 如果你的程式有用到 CHEAT_MODE
      CHEAT_MODE: false 

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Schedule & Odds Scraper (Always Run)
        run: |
          echo "🏀 Fetching Schedule & Odds..."
          python scrape_schedule.py
          
          echo "🏆 Grading Past Picks..."
          python grade_picks.py

      - name: Run AI Prediction Pipeline (Only at 22:00 CST or Manual Trigger)
        run: |
          # 取得當前小時 (UTC)
          CURRENT_HOUR=$(date -u +%H)
          echo "Current UTC Hour: $CURRENT_HOUR"
          
          # 判斷邏輯：UTC 14點 (台22點) 或 手動觸發
          if [ "$CURRENT_HOUR" == "14" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "🚀 It's 22:00 CST (or triggered manually)! Starting AI Prediction Pipeline..."
            
            # 1. 下載數據 (確保包含 PlayerStatistics.csv)
            echo "📥 Updating Data from Kaggle..."
            python fetch_kaggle_data.py

            # 2. 🔥 新增：建立球員影響力歷史特徵 (給訓練用)
            echo "🏗️ Building Roster Impact Features..."
            python build_player_features.py

            # 3. 訓練模型
            echo "🧠 Training Model..."
            python train_model.py
            
            # 4. 🔥 新增：匯出球員戰力庫 (給預測用)
            echo "📊 Exporting Player Impact Maps..."
            python utils/export_impact_data.py

            # 5. 執行預測 (含傷兵爬蟲)
            echo "🔮 Generating Picks..."
            python aggregate_picks.py
            
          else
            echo "💤 It's not 22:00 CST yet. Skipping Prediction & Data Update."
            echo "✅ Only Schedule, Odds & Grading were updated."
          fi

      - name: Commit and Push Results
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 加入所有變更 (包含 .pkl, .csv 等)
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Auto-update: Schedule, Odds & AI Picks [Skip CI]"
            git push
          fi